<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b24"><title>Mine kameraer</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f1f6f8;background:#0d1720}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#25475a 0%,#101d28 48%,#0c151e 100%)}button{font:inherit;cursor:pointer}main{max-width:1040px;margin:auto;padding:clamp(22px,5vw,54px) 18px}.eyebrow{color:#80cdd6;text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:2px}h1{font-size:clamp(30px,6vw,48px);letter-spacing:-1.5px;margin:12px 0}p{color:#a9beca;line-height:1.5}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{border:1px solid #365163;color:#bdd8e3;padding:9px 13px;border-radius:40px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:20px;margin-top:35px}.camera{background:#172b38;border:1px solid #345061;color:#fff;text-align:left;border-radius:22px;overflow:hidden;padding:0;box-shadow:0 15px 40px #0003;transition:transform .2s,border-color .2s}.camera:hover{transform:translateY(-3px);border-color:#65c7d0}.thumb{height:185px;display:grid;place-items:center;background:linear-gradient(145deg,#26485a,#101d28);position:relative}.thumb svg{width:72px;height:72px;stroke:#a2dce0;fill:none;stroke-width:1.4}.pill{position:absolute;top:14px;left:14px;border-radius:20px;padding:6px 10px;background:#102b36bd;font-size:12px}.info{padding:18px 20px 20px;display:flex;justify-content:space-between;align-items:center}.info strong{font-size:19px}.info small{display:block;color:#9fb9c6;margin-top:6px}.arrow{font-size:27px;color:#88d9db}.hidden{display:none!important}.back{background:transparent;color:#c9e2eb;border:1px solid #3e5b6a;border-radius:12px;padding:10px 14px}.viewer{margin-top:24px;border:1px solid #375364;border-radius:22px;overflow:hidden;background:#091018}.viewerhead{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.viewerhead strong{font-size:18px}.screen{position:relative;aspect-ratio:16/9;background:#05090c;display:grid;place-items:center;min-height:220px}.screen img{display:block;width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.screen .status{z-index:1;background:#09151fdc;border-radius:14px;padding:15px;max-width:85%;text-align:center;color:#b7cdd9;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;padding:15px}.actions button{border:1px solid #466375;background:#203745;color:#e9f7fa;border-radius:12px;padding:10px 14px}.hint{font-size:13px;margin-top:14px}footer{margin-top:50px;color:#668595;font-size:12px}@media(max-width:600px){main{padding:28px 14px}.screen{min-height:200px}.viewerhead{padding:13px}}
</style></head>
<body><main><section id="home"><div class="top"><span class="eyebrow">Kameraoversikt</span><span id="count" class="count"></span></div><h1>Mine kameraer</h1><p>Velg kameraet du vil se. Flere kameraer kan legges til etter hvert.</p><div class="grid" id="grid"></div></section>
<section id="detail" class="hidden"><button class="back" id="back">← Alle kameraer</button><div class="viewer"><div class="viewerhead"><strong id="cameraTitle"></strong><span class="eyebrow">Kameravisning</span></div><div class="screen" id="screen"><img id="video" alt="Kamerabilde" hidden><div class="status" id="status">Klargjør videovisning …</div></div><div class="actions"><button id="retry">↻ Prøv igjen</button><button id="fullscreen">⛶ Fullskjerm</button></div></div><p class="hint" id="hint"></p></section><footer>Utekamera · Kameraer via Home Assistant</footer></main>
<script>
"use strict";
// Legg til flere kameraer her. Ingen brukernavn, passord eller tokens i denne filen.
const cameras=[{id:"utekamera",name:"Utekamera",subtitle:"Fuglebrettet",entity:"camera.utekamera"}];
const $=id=>document.getElementById(id);
let selected=null;
$("count").textContent=cameras.length+" kamera";
const cameraSvg='<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="18" width="35" height="29" rx="7"/><path d="m43 27 13-7v25l-13-7"/><circle cx="25" cy="32" r="9"/></svg>';
for(const c of cameras){const b=document.createElement("button");b.className="camera";b.innerHTML='<div class="thumb"><span class="pill">● Kamera</span>'+cameraSvg+'</div><div class="info"><span><strong></strong><small></small></span><span class="arrow">→</span></div>';b.querySelector("strong").textContent=c.name;b.querySelector("small").textContent=c.subtitle;b.onclick=()=>openCamera(c);$("grid").append(b)}
function showHome(){selected=null;$("video").src="";$("video").hidden=true;$("detail").classList.add("hidden");$("home").classList.remove("hidden");history.replaceState(null,"",location.pathname)}
function openCamera(c){selected=c;$("home").classList.add("hidden");$("detail").classList.remove("hidden");$("cameraTitle").textContent=c.name;$("hint").textContent="Video hentes gjennom Home Assistant. Tilgang må autentiseres på en sikker måte.";history.replaceState(null,"","#"+encodeURIComponent(c.id));loadStream()}
function loadStream(){if(!selected)return;const img=$("video"),status=$("status");img.hidden=true;status.hidden=false;status.textContent="Prøver å hente videostrøm …";const endpoint="/api/camera_proxy_stream/"+encodeURIComponent(selected.entity);img.onload=()=>{img.hidden=false;status.hidden=true};img.onerror=()=>{img.hidden=true;status.hidden=false;status.textContent="Videostrømmen kunne ikke åpnes her. Denne frittstående siden trenger en autentisert videoløsning fra Home Assistant; kameraet fungerer fortsatt i HA-dashbordet."};img.src=endpoint+"?t="+Date.now()}
$("back").onclick=showHome;$("retry").onclick=loadStream;$("fullscreen").onclick=()=>{const el=$("screen");if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen?.()};
const initial=cameras.find(c=>c.id===decodeURIComponent(location.hash.slice(1)));if(initial)openCamera(initial);
</script></body></html>
