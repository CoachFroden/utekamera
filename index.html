<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b24"><title>Mine kameraer</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f1f6f8;background:#0d1720}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#25475a 0%,#101d28 48%,#0c151e 100%)}button{font:inherit;cursor:pointer}main{max-width:1040px;margin:auto;padding:clamp(22px,5vw,54px) 18px}.eyebrow{color:#80cdd6;text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:2px}h1{font-size:clamp(30px,6vw,48px);letter-spacing:-1.5px;margin:12px 0}p{color:#a9beca;line-height:1.5}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{border:1px solid #365163;color:#bdd8e3;padding:9px 13px;border-radius:40px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:20px;margin-top:35px}.camera{background:#172b38;border:1px solid #345061;color:#fff;text-align:left;border-radius:22px;overflow:hidden;padding:0;box-shadow:0 15px 40px #0003;transition:transform .2s,border-color .2s}.camera:hover{transform:translateY(-3px);border-color:#65c7d0}.thumb{height:185px;display:grid;place-items:center;background:linear-gradient(145deg,#26485a,#101d28);position:relative}.thumb svg{width:72px;height:72px;stroke:#a2dce0;fill:none;stroke-width:1.4}.pill{position:absolute;top:14px;left:14px;border-radius:20px;padding:6px 10px;background:#102b36bd;font-size:12px}.info{padding:18px 20px 20px;display:flex;justify-content:space-between;align-items:center}.info strong{font-size:19px}.info small{display:block;color:#9fb9c6;margin-top:6px}.arrow{font-size:27px;color:#88d9db}.hidden{display:none!important}.back{background:transparent;color:#c9e2eb;border:1px solid #3e5b6a;border-radius:12px;padding:10px 14px}.viewer{margin-top:24px;border:1px solid #375364;border-radius:22px;overflow:hidden;background:#091018}.viewerhead{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.viewerhead strong{font-size:18px}.screen{position:relative;aspect-ratio:16/9;background:#05090c;display:grid;place-items:center;min-height:220px}.screen img{display:block;width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.screen .status{z-index:1;background:#09151fdc;border-radius:14px;padding:15px;max-width:85%;text-align:center;color:#b7cdd9;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;padding:15px}.actions button{border:1px solid #466375;background:#203745;color:#e9f7fa;border-radius:12px;padding:10px 14px}.hint{font-size:13px;margin-top:14px}.connect{margin-top:22px;padding:16px;border:1px solid #365163;border-radius:16px;background:#142632}.connect label{display:block;font-size:13px;margin-bottom:8px;color:#bdd8e3}.connect input{width:100%;padding:11px;border-radius:10px;background:#0b1822;border:1px solid #486374;color:white;font:inherit}.connect button{margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid #66aeb8;background:#235566;color:white}.connect p{font-size:13px;margin:8px 0 0}footer{margin-top:50px;color:#668595;font-size:12px}@media(max-width:600px){main{padding:28px 14px}.screen{min-height:200px}.viewerhead{padding:13px}}
</style></head>
<body><main><section id="home"><div class="top"><span class="eyebrow">Kameraoversikt</span><span id="count" class="count"></span></div><h1>Mine kameraer</h1><p>Velg kameraet du vil se. Flere kameraer kan legges til etter hvert.</p><div class="connect"><label for="haUrl">Home Assistant-adresse (Nabu Casa)</label><input id="haUrl" type="url" placeholder="https://…ui.nabu.casa" autocomplete="url"><button id="connect">Koble til Home Assistant</button><p id="authStatus">Ikke tilkoblet. Adressen lagres bare i denne nettleseren.</p></div><div class="grid" id="grid"></div></section>
<section id="detail" class="hidden"><button class="back" id="back">← Alle kameraer</button><div class="viewer"><div class="viewerhead"><strong id="cameraTitle"></strong><span class="eyebrow">Kameravisning</span></div><div class="screen" id="screen"><img id="video" alt="Kamerabilde" hidden><div class="status" id="status">Klargjør videovisning …</div></div><div class="actions"><button id="retry">↻ Prøv igjen</button><button id="fullscreen">⛶ Fullskjerm</button></div></div><p class="hint" id="hint"></p></section><footer>Utekamera · Kameraer via Home Assistant</footer></main>
<script>
"use strict";
// Legg til flere kameraer her. Ingen brukernavn, passord eller tokens i denne filen.
const cameras=[{id:"utekamera",name:"Utekamera",subtitle:"Fuglebrettet",entity:"camera.utekamera"}];
const $=id=>document.getElementById(id);
let selected=null;
const HA_KEY="utekamera_ha_url";
const AUTH_KEY="utekamera_oauth_pending";
let accessToken=null;
const cleanHaUrl=value=>{try{const u=new URL(value);if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash)return null;return u.origin}catch{return null}};
$("haUrl").value=localStorage.getItem(HA_KEY)||"";
function authStatus(message){$("authStatus").textContent=message}
function base64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\\+/g,"-").replace(/\\//g,"_").replace(/=+$/,"")}
async function beginLogin(){
  const ha=cleanHaUrl($("haUrl").value);
  if(!ha){authStatus("Skriv inn en gyldig https-adresse til Home Assistant.");return}
  localStorage.setItem(HA_KEY,ha);
  if(!window.crypto?.subtle){authStatus("Sikker innlogging krever HTTPS.");return}
  const verifier=base64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge=base64url(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier))));
  const state=base64url(crypto.getRandomValues(new Uint8Array(24)));
  const redirect=location.origin+location.pathname;
  sessionStorage.setItem(AUTH_KEY,JSON.stringify({ha,verifier,state,redirect}));
  const url=new URL("/auth/authorize",ha);
  url.searchParams.set("response_type","code");
  url.searchParams.set("client_id",location.origin);
  url.searchParams.set("redirect_uri",redirect);
  url.searchParams.set("state",state);
  url.searchParams.set("code_challenge",challenge);
  url.searchParams.set("code_challenge_method","S256");
  location.assign(url.toString());
}
async function completeLogin(){
  const params=new URLSearchParams(location.search);
  if(!params.has("code")&&!params.has("error"))return;
  history.replaceState(null,"",location.pathname+location.hash);
  const pending=JSON.parse(sessionStorage.getItem(AUTH_KEY)||"null");
  sessionStorage.removeItem(AUTH_KEY);
  if(params.has("error")){authStatus("Innlogging avbrutt: "+params.get("error"));return}
  if(!pending||params.get("state")!==pending.state){authStatus("Innlogging kunne ikke bekreftes. Prøv på nytt.");return}
  try{
    const body=new URLSearchParams({grant_type:"authorization_code",code:params.get("code"),client_id:location.origin,redirect_uri:pending.redirect,code_verifier:pending.verifier});
    const response=await fetch(pending.ha+"/auth/token",{method:"POST",body});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await response.json();
    if(!data.access_token)throw new Error("Mangler tilgangstoken");
    accessToken=data.access_token; // Kun i minnet; aldri lagret i GitHub eller localStorage.
    authStatus("Innlogging godkjent. Videotilkobling fra Vercel gjenstår.");
  }catch(err){authStatus("Kunne ikke fullføre innlogging fra denne adressen ("+err.message+"). Home Assistant kan blokkere forespørselen på tvers av domener.")}
}
$("connect").onclick=beginLogin;
completeLogin();
$("count").textContent=cameras.length+" kamera";
const cameraSvg='<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="18" width="35" height="29" rx="7"/><path d="m43 27 13-7v25l-13-7"/><circle cx="25" cy="32" r="9"/></svg>';
for(const c of cameras){const b=document.createElement("button");b.className="camera";b.innerHTML='<div class="thumb"><span class="pill">● Kamera</span>'+cameraSvg+'</div><div class="info"><span><strong></strong><small></small></span><span class="arrow">→</span></div>';b.querySelector("strong").textContent=c.name;b.querySelector("small").textContent=c.subtitle;b.onclick=()=>openCamera(c);$("grid").append(b)}
function showHome(){selected=null;$("video").src="";$("video").hidden=true;$("detail").classList.add("hidden");$("home").classList.remove("hidden");history.replaceState(null,"",location.pathname)}
function openCamera(c){selected=c;$("home").classList.add("hidden");$("detail").classList.remove("hidden");$("cameraTitle").textContent=c.name;$("hint").textContent="Livevideo fra Vercel krever en egen sikker videobro. Innlogging alene gir ikke nettleseren direkte tilgang til RTSP-strømmen.";history.replaceState(null,"","#"+encodeURIComponent(c.id));loadStream()}
function loadStream(){if(!selected)return;const img=$("video"),status=$("status");img.src="";img.hidden=true;status.hidden=false;status.textContent="Kameraet er klart i Home Assistant. Sikker videobro til Vercel er ikke koblet opp ennå."; }
$("back").onclick=showHome;$("retry").onclick=loadStream;$("fullscreen").onclick=()=>{const el=$("screen");if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen?.()};
const initial=cameras.find(c=>c.id===decodeURIComponent(location.hash.slice(1)));if(initial)openCamera(initial);
</script></body></html>
